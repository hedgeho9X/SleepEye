name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: |
          env CLANG_MODULE_CACHE_PATH=.build/clang-module-cache \
            swift test --cache-path .build/swiftpm-cache

      - name: Build local app bundle
        run: ./scripts/package-app.sh

      - name: Upload local app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepEye-local-build
          path: |
            dist/SleepEye-*-macos.zip
            dist/SleepEye-*-macos.sha256
